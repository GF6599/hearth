# cargo-deny configuration. `just deny` runs it, and `just check` includes it.
# Every key absent here keeps the cargo-deny default.

[licenses]
# The SPDX identifiers present in Cargo.lock. Add one only as a deliberate
# decision about a new dependency, never as a glob.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "Unicode-3.0",
    "Zlib",
    # The pure Rust TLS for the weather: the dalek curves and subtle are
    # BSD-3-Clause, rustls-webpki and untrusted are ISC.
    "BSD-3-Clause",
    "ISC",
]

[advisories]
ignore = [
    # bincode 1.3.3 is unmaintained, not vulnerable, and its authors call it
    # complete. syntect uses it only to decode the syntax dump compiled into
    # the binary, never data from a user or a repository.
    { id = "RUSTSEC-2025-0141", reason = "syntect decodes only its own embedded syntax dump" },
    # paste is unmaintained, not vulnerable. rustls-rustcrypto uses the macro
    # at build time only, and no input reaches it at run time.
    { id = "RUSTSEC-2024-0436", reason = "paste is a build-time macro of rustls-rustcrypto" },
]

[bans]
# A warning and not a denial: clap_derive has moved to syn 3 while the other
# derive macros still use syn 2, and kasuari holds an older hashbrown than
# the rest of ratatui. Make it "deny" when the graph holds one of each again.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
