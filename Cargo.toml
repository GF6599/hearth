[package]
name = "hearth"
version = "0.1.9"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "A terminal screensaver with a picker of scenes"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
clap = { version = "4.6.6", features = ["derive"] }
# ChaCha's output is a published specification, so a seed draws the same
# frames after a crate upgrade.
rand = { version = "0.10", default-features = false }
rand_chacha = { version = "0.10", default-features = false }
# The same crate ratatui measures cells with, so the corpus and the
# renderer agree on every width.
unicode-width = "0.2"
# fancy-regex instead of oniguruma, so the build needs no C toolchain.
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
# One parser reads and writes the config file, and a write keeps the
# user's comments and key order.
toml_edit = "0.25"
# A pure Rust MP3 decoder, so the sound recordings play without a C
# toolchain and without a second lossy encode.
nanomp3 = "0.2"
# HTTPS for the weather, in pure Rust: rustls takes the RustCrypto provider
# in place of ring or aws-lc-rs, which both compile C. The provider has only
# a pre-release, so it is pinned.
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider"] }
rustls-rustcrypto = "=0.1.0-pre.0"
rustls-native-certs = "0.8"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
# Each file under tests/ opts out on its first line with
# `#![allow(clippy::expect_used, ...)]`.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
needless_collect = "warn"
or_fun_call = "warn"
redundant_clone = "warn"

[dev-dependencies]
# Replays the bytes hearth writes, so a test reads the screen a terminal
# would show and not the escapes that drew it.
vt100 = "0.18.1"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18"
