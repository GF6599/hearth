[package]
name = "hearth"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "A terminal screensaver: a bonsai, matrix rain, fire, pipes, life and an aquarium in one app"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
clap = { version = "4.6.6", features = ["derive"] }
# ChaCha's output is a published specification, so a seed draws the same
# frames after a crate upgrade.
rand = { version = "0.10", default-features = false }
rand_chacha = { version = "0.10", default-features = false }
# The same crate ratatui measures cells with, so the corpus and the
# renderer agree on every width.
unicode-width = "0.2"
# fancy-regex instead of oniguruma, so the build needs no C toolchain.
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
# One parser reads and writes the config file, and a write keeps the
# user's comments and key order.
toml_edit = "0.25"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
# Tests opt out per module with `#![allow(clippy::expect_used, ...)]` at the
# top of their `#[cfg(test)] mod tests` block.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
needless_collect = "warn"
or_fun_call = "warn"
redundant_clone = "warn"

[dev-dependencies]
# Replays the bytes hearth writes, so a test reads the screen a terminal
# would show and not the escapes that drew it.
vt100 = "0.18.1"
