version: 2

# `just build` keeps its signed binary in dist/, which `--clean` would delete,
# so the release builds under the ignored target/ instead.
dist: target/goreleaser

before:
  hooks:
    - rustup default stable
    - cargo install --locked cargo-zigbuild@0.23.4

builds:
  # Apple's linker builds the macOS binaries. zig's writes a framework once for
  # each crate that asks for it, and dyld refuses to start a binary that names
  # one library twice.
  - id: macos
    builder: rust
    binary: hearth
    command: build
    flags:
      - --release
      - --locked
    targets:
      - x86_64-apple-darwin
      - aarch64-apple-darwin
    hooks:
      post:
        - cmd: scripts/macos-binary-starts.sh "{{ .Path }}" "{{ .Target }}"
  - id: linux
    builder: rust
    binary: hearth
    flags:
      - --release
      - --locked
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu

archives:
  - formats:
      - tar.gz
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

homebrew_casks:
  - name: hearth
    repository:
      owner: GF6599
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/GF6599/hearth
    description: A terminal screensaver of fire, embers, a flock, a bonsai and more
    license: MIT
    # Homebrew quarantines what a cask downloads, and macOS reports a quarantined
    # binary that nobody notarized as damaged rather than running it. Notarizing
    # needs a paid Apple developer account, so the cask clears the attribute.
    # GoReleaser renders `hooks.post.install` as `postflight`, which Homebrew 6.0
    # deprecates, so the stanza goes in through `custom_block` instead. GoReleaser
    # templates the rendered cask one more time. The escape therefore leaves a
    # literal {{staged_path}} for Homebrew to expand at install time.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/hearth"]
        end
      end

changelog:
  sort: asc
  # The history is gitmoji, so the filters drop the doc, test, config and CI
  # commits by their emoji rather than by a conventional-commit prefix.
  filters:
    exclude:
      - "^📝"
      - "^🧪"
      - "^✅"
      - "^🔧"
      - "^👷"
